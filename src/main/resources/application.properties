spring.application.name=college-election
server.port=8080

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/college_elections
spring.datasource.username=root
spring.datasource.password=*****
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Jackson (Format dates as ISO-8601 strings, not timestamps or integer arrays)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss

# Admin
admin.email=admin@cmrcet.ac.in

# JWT
jwt.secret=*********
jwt.expiration=86400000

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=**********
spring.security.oauth2.client.registration.google.client-secret=**********
spring.security.oauth2.client.registration.google.scope=email,profile

# Frontend URL
app.frontend-url=http://localhost:5173

# Cloudinary
cloudinary.cloud-name=***********
cloudinary.api-key=***********
cloudinary.api-secret=***********
